prefix: "%brand_prefix%"
general:
  player-not-found: "%brand_prefix%The player <color:#22D3EE>%player%</color> could not be found.</gray>"
  profile-not-loaded: "%brand_prefix%✖ Your profile is not loaded yet. Please try again in a moment.</gray>"
  no-permission: "%brand_prefix%✖ You do not have permission to do that.</gray>"
  players-only: "%brand_prefix%✖ This command can only be used by players.</gray>"
currency:
  coins: "<color:#FBBF24>Coins</color>"
  gems: "<color:#2DD4BF>Gems</color>"
chat:
  format: "%prefix% %name% <dark_gray>»</dark_gray> %message%"
rank:
  admin-prefix: "<red><b>Admin</b></red>"
  default-prefix: "<gray>Player</gray>"
join:
  message: "<dark_gray>[<color:#2DD4BF>+</color>]</dark_gray> <gray>%player%</gray>"
  first-message: "<dark_gray>[<color:#FBBF24>◆</color>]</dark_gray> <color:#FBBF24>%player%</color> <gray>joined</gray> %brand% <gray>for the first time!</gray>"
  profile-error: "%brand%<newline><newline><gray>✖ Your profile could not be loaded.</gray><newline><gray>Please try again in a moment.</gray>"
quit:
  message: "<dark_gray>[<red>-</red>]</dark_gray> <gray>%player%</gray>"
economy:
  balance: "%brand_prefix%Your balance: <color:#FBBF24>◆ %amount%</color> %currency%</gray>"
  deposit-success: "%brand_prefix%✔ You received <color:#FBBF24>%amount%</color> %currency%<gray>. New balance: <color:#FBBF24>%balance%</color></gray>"
  withdraw-success: "%brand_prefix%✔ Withdrew <color:#FBBF24>%amount%</color> %currency%<gray>. New balance: <color:#FBBF24>%balance%</color></gray>"
  insufficient-funds: "%brand_prefix%✖ Not enough %currency%<gray>. You are missing <color:#FBBF24>%missing%</color>.</gray>"
  transaction-failed: "%brand_prefix%✖ The transaction could not be completed.</gray>"
  usage: "%brand_prefix%Usage: <color:#22D3EE>/economy give|take|set player currency amount</color></gray>"
  invalid-currency: "%brand_prefix%✖ Unknown currency. Available: <color:#FBBF24>%currencies%</color><gray>.</gray>"
  invalid-amount: "%brand_prefix%✖ The amount must be a whole number greater than 0.</gray>"
  give-success: "%brand_prefix%✔ Gave <color:#FBBF24>%amount%</color> %currency% <gray>to <color:#22D3EE>%player%</color>. New balance: <color:#FBBF24>%balance%</color></gray>"
  take-success: "%brand_prefix%✔ Took <color:#FBBF24>%amount%</color> %currency% <gray>from <color:#22D3EE>%player%</color>. New balance: <color:#FBBF24>%balance%</color></gray>"
  take-insufficient: "%brand_prefix%✖ <color:#22D3EE>%player%</color> <gray>does not have enough</gray> %currency%<gray>. Balance: <color:#FBBF24>%balance%</color></gray>"
  set-success: "%brand_prefix%✔ Set the balance of <color:#22D3EE>%player%</color> to <color:#FBBF24>%amount%</color> %currency%<gray>.</gray>"
menu:
  back: "<gray>Back</gray>"
  close: "<red>Close</red>"
  next: "<color:#22D3EE>Next page ●</color>"
  previous: "<color:#22D3EE>● Previous page</color>"
tablist:
  header: "%title%<newline><gray>Players online: <color:#22D3EE>%online%</color></gray>"
  footer: "<gray>play.prismarin.net</gray>"
sidebar:
  title: "%brand%"
lobby:
  join:
    title: "%brand%"
    subtitle: "<gray>Welcome back, <color:#22D3EE>%player%</color>.</gray>"
    first-title: "%brand%"
    first-subtitle: "<color:#FBBF24>◆</color> <gray>Welcome, <color:#FBBF24>%player%</color>! Open the navigator with the compass.</gray>"
  item:
    navigator:
      name: "<color:#22D3EE>◆ Navigator</color> <dark_gray>› Right click</dark_gray>"
      lore: "<gray>Opens the server selection.</gray>"
    profile:
      name: "<color:#2DD4BF>● %player%</color> <dark_gray>› Right click</dark_gray>"
      lore:
        coins: "<gray>Coins:</gray> <color:#FBBF24>◆ %coins%</color>"
        gems: "<gray>Gems:</gray> <color:#2DD4BF>%gems%</color>"
        level: "<gray>Level:</gray> <color:#22D3EE>%level%</color>"
    hider:
      visible: "<color:#2DD4BF>● Players visible</color> <dark_gray>› Right click</dark_gray>"
      hidden: "<gray>● Players hidden</gray> <dark_gray>› Right click</dark_gray>"
      lore: "<gray>Hides every other player.</gray>"
  navigator:
    title: "<gradient:#22D3EE:#2DD4BF><b>Navigator</b></gradient>"
    here-name: "<gray>%server%</gray>"
    here: "<gray>● You are here.</gray>"
    connect: "<color:#22D3EE>» Click to connect</color>"
    connecting: "%brand_prefix%Connecting you to %server%<gray> ...</gray>"
    already-here: "<gray>You are already on this server.</gray>"
    description:
      lobby: "<gray>The central hub of the network.</gray>"
      build: "<gray>Free building on your own plots.</gray>"
      game: "<gray>Rounds, points and leaderboards.</gray>"
  profile:
    title: "<gradient:#22D3EE:#2DD4BF><b>Profile</b></gradient>"
    coins:
      name: "<color:#FBBF24>◆ Coins</color>"
      lore: "<gray>Balance:</gray> <color:#FBBF24>%coins%</color>"
    gems:
      name: "<color:#2DD4BF>◆ Gems</color>"
      lore: "<gray>Balance:</gray> <color:#2DD4BF>%gems%</color>"
    level:
      name: "<color:#22D3EE>◆ Level %level%</color>"
      lore: "%bar% <gray>%xp%/%max% XP</gray>"
    locale:
      name: "<color:#22D3EE>◆ Language</color>"
      current: "<gray>Current:</gray> <color:#22D3EE>English</color>"
      hint: "<color:#22D3EE>» Click for German</color>"
      changed: "%brand_prefix%✔ Language switched to <color:#22D3EE>English</color>.</gray>"
  hider:
    hidden: "<gray>All players are now <color:#22D3EE>hidden</color>.</gray>"
    shown: "<gray>All players are now <color:#2DD4BF>visible</color>.</gray>"
    cooldown: "<gray>Please wait another <color:#FBBF24>%seconds%s</color>.</gray>"
  build:
    enabled: "%brand_prefix%✔ Build mode <color:#2DD4BF>enabled</color>. The lobby protections no longer apply to you.</gray>"
    disabled: "%brand_prefix%✔ Build mode <color:#22D3EE>disabled</color>. The lobby protections apply again.</gray>"
  setspawn:
    success: "%brand_prefix%✔ Spawn set: <color:#22D3EE>%x% / %y% / %z%</color> <gray>in</gray> <color:#22D3EE>%world%</color><gray>.</gray>"
    failed: "%brand_prefix%✖ The spawn could not be saved.</gray>"
  sidebar:
    rank-label: "<gray>Rank</gray>"
    rank: " %rank%"
    coins: "<color:#FBBF24>◆</color> <gray>Coins:</gray> <color:#FBBF24>%coins%</color>"
    gems: "<color:#2DD4BF>◆</color> <gray>Gems:</gray> <color:#2DD4BF>%gems%</color>"
    level: "<gray>Level</gray> <color:#22D3EE>%level%</color>"
    progress: " %bar% <dark_gray>%xp%/%max%</dark_gray>"
    online: "<gray>Online:</gray> <color:#22D3EE>%online%</color>"
    footer: "<color:#22D3EE>prismarin.net</color>"
network:
  menu:
    title: "<dark_gray>Network</dark_gray> <dark_gray>(</dark_gray><color:#2DD4BF>%online%</color><dark_gray>/</dark_gray><gray>%total%</gray><dark_gray>)</dark_gray>"
    summary: "<white>%players%</white> <gray>players on</gray> <color:#2DD4BF>%online%</color><gray>/%total% servers</gray>"
    refresh: "<color:#22D3EE>Refresh</color>"
  server:
    group: "<gray>Group:</gray> <white>%group%</white>"
    offline: "<red>● Offline</red>"
    players: "<gray>Players:</gray> <white>%players%</white><dark_gray>/</dark_gray><gray>%max%</gray>"
    ping: "<gray>Ping:</gray> <white>%ping% ms</white>"
    ping-unknown: "<gray>Ping:</gray> <dark_gray>unknown</dark_gray>"
    version: "<gray>Version:</gray> <white>%version%</white>"
    tps: "<gray>TPS:</gray> <white>%tps%</white> <dark_gray>(%mspt% ms/tick)</dark_gray>"
    memory: "<gray>RAM:</gray> <white>%used%</white><dark_gray>/</dark_gray><gray>%max% MB</gray>"
    uptime: "<gray>Uptime:</gray> <white>%uptime%</white>"
    no-metrics: "<dark_gray>No PRISMARIN: ping data only</dark_gray>"
    here: "<color:#2DD4BF>● You are here</color>"
    connect: "<color:#22D3EE>Click to connect</color>"
