prefix: "%brand_prefix%"
general:
  players-only: "%brand_prefix%✖ Dieser Befehl kann nur von Spielern verwendet werden.</gray>"
  no-permission: "%brand_prefix%✖ Dafür fehlt dir die Berechtigung.</gray>"
hub:
  already-there: "%brand_prefix%Du bist bereits mit der Lobby verbunden.</gray>"
  connected: "%brand_prefix%✔ Du wurdest mit der Lobby verbunden.</gray>"
  unreachable: "%brand_prefix%✖ Die Lobby ist gerade nicht erreichbar. Versuche es gleich erneut.</gray>"
sendall:
  usage: "%brand_prefix%Verwendung: <color:#22D3EE>/sendall Server</color></gray>"
  unknown-server: "%brand_prefix%✖ Der Server <color:#22D3EE>%server%</color> ist nicht registriert.</gray>"
  success: "%brand_prefix%✔ <color:#22D3EE>%count%</color> Spieler werden zu <color:#22D3EE>%server%</color> geschickt.</gray>"
maintenance:
  usage: "%brand_prefix%Verwendung: <color:#22D3EE>/maintenance on|off|status</color> <gray>oder</gray> <color:#22D3EE>/maintenance server|group Name on|off</color></gray>"
  enabled: "%brand_prefix%✔ Wartungsmodus aktiviert. Neue Verbindungen ohne Bypass werden abgewiesen.</gray>"
  disabled: "%brand_prefix%✔ Wartungsmodus deaktiviert. Das Netzwerk ist wieder für alle offen.</gray>"
  already-on: "%brand_prefix%Der Wartungsmodus ist bereits aktiv.</gray>"
  already-off: "%brand_prefix%Der Wartungsmodus ist bereits deaktiviert.</gray>"
  status-on: "%brand_prefix%Wartungsmodus: <color:#FBBF24>● aktiv</color></gray>"
  status-off: "%brand_prefix%Wartungsmodus: <color:#2DD4BF>● inaktiv</color></gray>"
  kick: "%brand%<newline><newline><color:#FBBF24>◆ Wartungsmodus</color><newline><newline><gray>Wir schrauben gerade am Netzwerk.</gray><newline><gray>Schau in Kürze wieder vorbei.</gray>"
  server-blocked: "%brand_prefix%✖ <color:#22D3EE>%server%</color> ist gerade in Wartung.</gray>"
  targets: "%brand_prefix%In Wartung: <color:#FBBF24>%targets%</color></gray>"
  target-on: "%brand_prefix%✔ <color:#22D3EE>%target%</color> ist jetzt in Wartung.</gray>"
  target-off: "%brand_prefix%✔ <color:#22D3EE>%target%</color> ist wieder offen.</gray>"
kick:
  redirected: "%brand_prefix%Deine Verbindung wurde getrennt. Du bist jetzt in der Lobby.</gray>"
  redirected-reason: "%brand_prefix%Deine Verbindung wurde getrennt. Du bist jetzt in der Lobby.</gray><newline><dark_gray>Grund:</dark_gray> <gray>%reason%</gray>"
staff:
  chat-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/sc Nachricht</color></gray>"
  chat: "<dark_gray>[</dark_gray><color:#FBBF24>Team</color><dark_gray>]</dark_gray> <gray>%server%</gray> <white>%player%</white><dark_gray>:</dark_gray> <gray>%message%</gray>"
  team-header: "%brand_prefix%Team online: <color:#22D3EE>%count%</color></gray>"
  team-entry: " <color:#2DD4BF>●</color> <white>%player%</white> <dark_gray>·</dark_gray> <gray>%server%</gray>"
  team-entry-vanished: " <dark_gray>●</dark_gray> <white>%player%</white> <dark_gray>· %server% · unsichtbar</dark_gray>"
  find-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/find Spieler</color></gray>"
  find: "%brand_prefix%<color:#22D3EE>%player%</color> ist auf <color:#22D3EE>%server%</color>.</gray>"
  not-online: "%brand_prefix%✖ <color:#22D3EE>%player%</color> ist nicht online.</gray>"
  goto-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/goto Spieler</color></gray>"
  goto: "%brand_prefix%Verbinde mit <color:#22D3EE>%server%</color> ...</gray>"
  send-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/send Spieler|all|server:Name Server|group:Name</color></gray>"
  unknown-server: "%brand_prefix%✖ Den Server <color:#22D3EE>%server%</color> gibt es nicht.</gray>"
  sent: "%brand_prefix%✔ <color:#22D3EE>%count%</color> Spieler werden nach <color:#22D3EE>%server%</color> geschickt.</gray>"
moderation:
  ban-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/ban Spieler [Dauer] Grund</color> <dark_gray>(Dauer z. B. 30m, 12h, 7d, 1w)</dark_gray></gray>"
  mute-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/mute Spieler [Dauer] Grund</color></gray>"
  kick-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/kick Spieler Grund</color></gray>"
  warn-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/warn Spieler Grund</color></gray>"
  unban-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/unban Spieler</color></gray>"
  unmute-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/unmute Spieler</color></gray>"
  history-usage: "%brand_prefix%Verwendung: <color:#22D3EE>/history Spieler</color></gray>"
  unknown-player: "%brand_prefix%✖ <color:#22D3EE>%player%</color> war noch nie im Netzwerk.</gray>"
  issued: "%brand_prefix%<white>%actor%</white> hat <color:#22D3EE>%player%</color> bestraft: <color:#FBBF24>%type%</color> <dark_gray>(%remaining%)</dark_gray> <gray>%reason%</gray> <dark_gray>#%id%</dark_gray>"
  nothing-active: "%brand_prefix%✖ <color:#22D3EE>%player%</color> hat keine aktive Strafe dieser Art.</gray>"
  revoked: "%brand_prefix%<white>%actor%</white> hat <color:#FBBF24>%type%</color> von <color:#22D3EE>%player%</color> aufgehoben.</gray>"
  history-header: "%brand_prefix%Strafen von <color:#22D3EE>%player%</color>: <white>%count%</white></gray>"
  history-entry: " <dark_gray>#%id% %date%</dark_gray> <gray>%type%</gray> <dark_gray>·</dark_gray> <gray>%reason%</gray> <dark_gray>von %actor%</dark_gray>"
  history-entry-active: " <dark_gray>#%id% %date%</dark_gray> <color:#FBBF24>%type% aktiv</color> <dark_gray>(%remaining%)</dark_gray> <gray>%reason%</gray> <dark_gray>von %actor%</dark_gray>"
  kick-screen: "%brand%<newline><newline><color:#FBBF24>Du wurdest gekickt</color><newline><newline><gray>Grund:</gray> <white>%reason%</white>"
  ban-screen: "%brand%<newline><newline><red>Du bist dauerhaft gesperrt</red><newline><newline><gray>Grund:</gray> <white>%reason%</white><newline><dark_gray>Fall #%id%</dark_gray>"
  tempban-screen: "%brand%<newline><newline><red>Du bist gesperrt</red><newline><newline><gray>Grund:</gray> <white>%reason%</white><newline><gray>Noch:</gray> <white>%remaining%</white><newline><dark_gray>Fall #%id%</dark_gray>"
  muted-notice: "%brand_prefix%✖ Du wurdest stummgeschaltet. Grund: <white>%reason%</white><gray>, Dauer:</gray> <white>%remaining%</white></gray>"
  warn-notice: "%brand_prefix%<color:#FBBF24>Verwarnung:</color> <white>%reason%</white></gray>"
  permanent: "dauerhaft"
reports:
  usage: "%brand_prefix%Verwendung: <color:#22D3EE>/report Spieler Grund</color></gray>"
  cooldown: "%brand_prefix%✖ Warte noch <color:#22D3EE>%seconds% s</color> bis zum nächsten Report.</gray>"
  filed: "%brand_prefix%✔ Danke, dein Report gegen <color:#22D3EE>%player%</color> ist beim Team.</gray>"
  notify: "<dark_gray>[</dark_gray><red>Report</red><dark_gray>]</dark_gray> <white>%reporter%</white> <gray>meldet</gray> <white>%player%</white> <dark_gray>(%server%)</dark_gray><gray>:</gray> <gray>%reason%</gray> <dark_gray>#%id%</dark_gray>"
  unknown: "%brand_prefix%✖ Es gibt keinen offenen Report <color:#22D3EE>#%id%</color>.</gray>"
  closed: "%brand_prefix%✔ Report <color:#22D3EE>#%id%</color> geschlossen.</gray>"
  header: "%brand_prefix%Offene Reports: <white>%count%</white></gray>"
  entry: " <dark_gray>#%id%</dark_gray> <white>%player%</white> <dark_gray>(%server%)</dark_gray> <gray>%reason%</gray> <dark_gray>von %reporter%</dark_gray>"
info:
  usage: "%brand_prefix%Verwendung: <color:#22D3EE>/pinfo Spieler</color></gray>"
  header: "%brand_prefix%Akte <color:#22D3EE>%player%</color> <dark_gray>%uuid%</dark_gray></gray>"
  online: " <color:#2DD4BF>● online</color> <gray>auf</gray> <white>%server%</white>"
  offline: " <dark_gray>● offline</dark_gray> <gray>zuletzt</gray> <white>%date%</white>"
  profile: " <gray>Erster Join</gray> <white>%first%</white> <dark_gray>·</dark_gray> <gray>Level</gray> <white>%level%</white> <dark_gray>·</dark_gray> <gray>Sprache</gray> <white>%locale%</white>"
  balances: " <gray>Konten:</gray> <white>%balances%</white>"
  punishments: " <gray>Strafen:</gray> <white>%count%</white> <dark_gray>·</dark_gray> <gray>gesperrt</gray> <white>%banned%</white> <dark_gray>·</dark_gray> <gray>stumm</gray> <white>%muted%</white>"
audit:
  header: "%brand_prefix%Letzte Aktionen: <white>%count%</white></gray>"
  entry: " <dark_gray>%date%</dark_gray> <white>%actor%</white> <color:#FBBF24>%action%</color> <gray>%target%</gray> <dark_gray>%details%</dark_gray>"
alert:
  usage: "%brand_prefix%Verwendung: <color:#22D3EE>/alert [-t] [server:Name|group:Name] Nachricht</color></gray>"
  message: "<dark_gray>[</dark_gray><color:#FBBF24>Info</color><dark_gray>]</dark_gray> %message%"
  title: "<color:#FBBF24><b>Info</b></color>"
  sent: "%brand_prefix%✔ An <color:#22D3EE>%count%</color> Spieler gesendet.</gray>"
netexec:
  usage: "%brand_prefix%Verwendung: <color:#22D3EE>/netexec all|Server|group:Name Befehl</color></gray>"
  needs-redis: "%brand_prefix%✖ /netexec braucht Redis, damit der Befehl die Server erreicht.</gray>"
  sent: "%brand_prefix%✔ <color:#22D3EE>%command%</color> an <color:#22D3EE>%target%</color> geschickt.</gray>"
alerts:
  server-up: "<dark_gray>[</dark_gray><color:#2DD4BF>Netzwerk</color><dark_gray>]</dark_gray> <white>%server%</white> <gray>ist wieder online.</gray>"
  server-down: "<dark_gray>[</dark_gray><red>Netzwerk</red><dark_gray>]</dark_gray> <white>%server%</white> <gray>ist offline.</gray>"
  low-tps: "<dark_gray>[</dark_gray><color:#FBBF24>Netzwerk</color><dark_gray>]</dark_gray> <white>%server%</white> <gray>läuft mit</gray> <color:#FBBF24>%tps% TPS</color><gray>.</gray>"
