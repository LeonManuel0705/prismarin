prefix: "%brand_prefix%"
general:
  players-only: "%brand_prefix%✖ This command can only be used by players.</gray>"
  no-permission: "%brand_prefix%✖ You do not have permission to do that.</gray>"
hub:
  already-there: "%brand_prefix%You are already connected to the lobby.</gray>"
  connected: "%brand_prefix%✔ You have been connected to the lobby.</gray>"
  unreachable: "%brand_prefix%✖ The lobby is currently unreachable. Please try again in a moment.</gray>"
sendall:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/sendall server</color></gray>"
  unknown-server: "%brand_prefix%✖ The server <color:#22D3EE>%server%</color> is not registered.</gray>"
  success: "%brand_prefix%✔ Sending <color:#22D3EE>%count%</color> players to <color:#22D3EE>%server%</color>.</gray>"
maintenance:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/maintenance on|off|status</color> <gray>or</gray> <color:#22D3EE>/maintenance server|group name on|off</color></gray>"
  enabled: "%brand_prefix%✔ Maintenance mode enabled. New connections without bypass will be rejected.</gray>"
  disabled: "%brand_prefix%✔ Maintenance mode disabled. The network is open to everyone again.</gray>"
  already-on: "%brand_prefix%Maintenance mode is already active.</gray>"
  already-off: "%brand_prefix%Maintenance mode is already disabled.</gray>"
  status-on: "%brand_prefix%Maintenance mode: <color:#FBBF24>● active</color></gray>"
  status-off: "%brand_prefix%Maintenance mode: <color:#2DD4BF>● inactive</color></gray>"
  kick: "%brand%<newline><newline><color:#FBBF24>◆ Maintenance</color><newline><newline><gray>We are working on the network right now.</gray><newline><gray>Please check back shortly.</gray>"
  server-blocked: "%brand_prefix%✖ <color:#22D3EE>%server%</color> is under maintenance.</gray>"
  targets: "%brand_prefix%Under maintenance: <color:#FBBF24>%targets%</color></gray>"
  target-on: "%brand_prefix%✔ <color:#22D3EE>%target%</color> is now under maintenance.</gray>"
  target-off: "%brand_prefix%✔ <color:#22D3EE>%target%</color> is open again.</gray>"
kick:
  redirected: "%brand_prefix%Your connection was closed. You are now in the lobby.</gray>"
  redirected-reason: "%brand_prefix%Your connection was closed. You are now in the lobby.</gray><newline><dark_gray>Reason:</dark_gray> <gray>%reason%</gray>"
staff:
  chat-usage: "%brand_prefix%Usage: <color:#22D3EE>/sc message</color></gray>"
  chat: "<dark_gray>[</dark_gray><color:#FBBF24>Staff</color><dark_gray>]</dark_gray> <gray>%server%</gray> <white>%player%</white><dark_gray>:</dark_gray> <gray>%message%</gray>"
  team-header: "%brand_prefix%Staff online: <color:#22D3EE>%count%</color></gray>"
  team-entry: " <color:#2DD4BF>●</color> <white>%player%</white> <dark_gray>·</dark_gray> <gray>%server%</gray>"
  team-entry-vanished: " <dark_gray>●</dark_gray> <white>%player%</white> <dark_gray>· %server% · vanished</dark_gray>"
  find-usage: "%brand_prefix%Usage: <color:#22D3EE>/find player</color></gray>"
  find: "%brand_prefix%<color:#22D3EE>%player%</color> is on <color:#22D3EE>%server%</color>.</gray>"
  not-online: "%brand_prefix%✖ <color:#22D3EE>%player%</color> is not online.</gray>"
  goto-usage: "%brand_prefix%Usage: <color:#22D3EE>/goto player</color></gray>"
  goto: "%brand_prefix%Connecting to <color:#22D3EE>%server%</color> ...</gray>"
  send-usage: "%brand_prefix%Usage: <color:#22D3EE>/send player|all|server:name server|group:name</color></gray>"
  unknown-server: "%brand_prefix%✖ There is no server called <color:#22D3EE>%server%</color>.</gray>"
  sent: "%brand_prefix%✔ Sending <color:#22D3EE>%count%</color> players to <color:#22D3EE>%server%</color>.</gray>"
moderation:
  ban-usage: "%brand_prefix%Usage: <color:#22D3EE>/ban player [duration] reason</color> <dark_gray>(duration e.g. 30m, 12h, 7d, 1w)</dark_gray></gray>"
  mute-usage: "%brand_prefix%Usage: <color:#22D3EE>/mute player [duration] reason</color></gray>"
  kick-usage: "%brand_prefix%Usage: <color:#22D3EE>/kick player reason</color></gray>"
  warn-usage: "%brand_prefix%Usage: <color:#22D3EE>/warn player reason</color></gray>"
  unban-usage: "%brand_prefix%Usage: <color:#22D3EE>/unban player</color></gray>"
  unmute-usage: "%brand_prefix%Usage: <color:#22D3EE>/unmute player</color></gray>"
  history-usage: "%brand_prefix%Usage: <color:#22D3EE>/history player</color></gray>"
  unknown-player: "%brand_prefix%✖ <color:#22D3EE>%player%</color> has never joined the network.</gray>"
  issued: "%brand_prefix%<white>%actor%</white> punished <color:#22D3EE>%player%</color>: <color:#FBBF24>%type%</color> <dark_gray>(%remaining%)</dark_gray> <gray>%reason%</gray> <dark_gray>#%id%</dark_gray>"
  nothing-active: "%brand_prefix%✖ <color:#22D3EE>%player%</color> has no active punishment of that kind.</gray>"
  revoked: "%brand_prefix%<white>%actor%</white> lifted the <color:#FBBF24>%type%</color> of <color:#22D3EE>%player%</color>.</gray>"
  history-header: "%brand_prefix%Punishments of <color:#22D3EE>%player%</color>: <white>%count%</white></gray>"
  history-entry: " <dark_gray>#%id% %date%</dark_gray> <gray>%type%</gray> <dark_gray>·</dark_gray> <gray>%reason%</gray> <dark_gray>by %actor%</dark_gray>"
  history-entry-active: " <dark_gray>#%id% %date%</dark_gray> <color:#FBBF24>%type% active</color> <dark_gray>(%remaining%)</dark_gray> <gray>%reason%</gray> <dark_gray>by %actor%</dark_gray>"
  kick-screen: "%brand%<newline><newline><color:#FBBF24>You were kicked</color><newline><newline><gray>Reason:</gray> <white>%reason%</white>"
  ban-screen: "%brand%<newline><newline><red>You are permanently banned</red><newline><newline><gray>Reason:</gray> <white>%reason%</white><newline><dark_gray>Case #%id%</dark_gray>"
  tempban-screen: "%brand%<newline><newline><red>You are banned</red><newline><newline><gray>Reason:</gray> <white>%reason%</white><newline><gray>Remaining:</gray> <white>%remaining%</white><newline><dark_gray>Case #%id%</dark_gray>"
  muted-notice: "%brand_prefix%✖ You were muted. Reason: <white>%reason%</white><gray>, duration:</gray> <white>%remaining%</white></gray>"
  warn-notice: "%brand_prefix%<color:#FBBF24>Warning:</color> <white>%reason%</white></gray>"
  permanent: "permanent"
reports:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/report player reason</color></gray>"
  cooldown: "%brand_prefix%✖ Wait <color:#22D3EE>%seconds% s</color> before your next report.</gray>"
  filed: "%brand_prefix%✔ Thanks, your report against <color:#22D3EE>%player%</color> reached the staff.</gray>"
  notify: "<dark_gray>[</dark_gray><red>Report</red><dark_gray>]</dark_gray> <white>%reporter%</white> <gray>reports</gray> <white>%player%</white> <dark_gray>(%server%)</dark_gray><gray>:</gray> <gray>%reason%</gray> <dark_gray>#%id%</dark_gray>"
  unknown: "%brand_prefix%✖ There is no open report <color:#22D3EE>#%id%</color>.</gray>"
  closed: "%brand_prefix%✔ Report <color:#22D3EE>#%id%</color> closed.</gray>"
  header: "%brand_prefix%Open reports: <white>%count%</white></gray>"
  entry: " <dark_gray>#%id%</dark_gray> <white>%player%</white> <dark_gray>(%server%)</dark_gray> <gray>%reason%</gray> <dark_gray>by %reporter%</dark_gray>"
info:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/pinfo player</color></gray>"
  header: "%brand_prefix%Record of <color:#22D3EE>%player%</color> <dark_gray>%uuid%</dark_gray></gray>"
  online: " <color:#2DD4BF>● online</color> <gray>on</gray> <white>%server%</white>"
  offline: " <dark_gray>● offline</dark_gray> <gray>last seen</gray> <white>%date%</white>"
  profile: " <gray>First join</gray> <white>%first%</white> <dark_gray>·</dark_gray> <gray>Level</gray> <white>%level%</white> <dark_gray>·</dark_gray> <gray>Language</gray> <white>%locale%</white>"
  balances: " <gray>Balances:</gray> <white>%balances%</white>"
  punishments: " <gray>Punishments:</gray> <white>%count%</white> <dark_gray>·</dark_gray> <gray>banned</gray> <white>%banned%</white> <dark_gray>·</dark_gray> <gray>muted</gray> <white>%muted%</white>"
audit:
  header: "%brand_prefix%Latest actions: <white>%count%</white></gray>"
  entry: " <dark_gray>%date%</dark_gray> <white>%actor%</white> <color:#FBBF24>%action%</color> <gray>%target%</gray> <dark_gray>%details%</dark_gray>"
alert:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/alert [-t] [server:name|group:name] message</color></gray>"
  message: "<dark_gray>[</dark_gray><color:#FBBF24>Info</color><dark_gray>]</dark_gray> %message%"
  title: "<color:#FBBF24><b>Info</b></color>"
  sent: "%brand_prefix%✔ Sent to <color:#22D3EE>%count%</color> players.</gray>"
netexec:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/netexec all|server|group:name command</color></gray>"
  needs-redis: "%brand_prefix%✖ /netexec needs Redis so the command reaches the servers.</gray>"
  sent: "%brand_prefix%✔ Sent <color:#22D3EE>%command%</color> to <color:#22D3EE>%target%</color>.</gray>"
alerts:
  server-up: "<dark_gray>[</dark_gray><color:#2DD4BF>Network</color><dark_gray>]</dark_gray> <white>%server%</white> <gray>is back online.</gray>"
  server-down: "<dark_gray>[</dark_gray><red>Network</red><dark_gray>]</dark_gray> <white>%server%</white> <gray>is offline.</gray>"
  low-tps: "<dark_gray>[</dark_gray><color:#FBBF24>Network</color><dark_gray>]</dark_gray> <white>%server%</white> <gray>runs at</gray> <color:#FBBF24>%tps% TPS</color><gray>.</gray>"
admin:
  info-header: "%brand_prefix%PRISMARIN proxy <white>%version%</white> as <color:#22D3EE>%server%</color></gray>"
  info-storage: " <gray>Storage</gray> <white>%storage%</white> <dark_gray>·</dark_gray> <gray>Bus</gray> <white>%bus%</white>"
  info-systems: " <gray>Systems:</gray> <white>%systems%</white>"
  info-players: " <gray>Players</gray> <white>%players%</white> <dark_gray>·</dark_gray> <gray>servers</gray> <white>%servers%</white> <dark_gray>·</dark_gray> <gray>vanished</gray> <white>%vanished%</white> <dark_gray>·</dark_gray> <gray>operators</gray> <white>%operators%</white>"
  migrate-usage: "%brand_prefix%Usage: <color:#22D3EE>/prismarinproxy migrate from to</color> <dark_gray>(%modes%)</dark_gray></gray>"
  migrate-console: "%brand_prefix%✖ Migration only runs from the console.</gray>"
  migrate-same: "%brand_prefix%✖ Source and target are the same.</gray>"
  migrate-start: "%brand_prefix%Moving data from <color:#22D3EE>%from%</color> to <color:#22D3EE>%to%</color> ...</gray>"
  migrate-done: "%brand_prefix%✔ Done: <white>%profiles%</white> profiles, <white>%balances%</white> balances, <white>%documents%</white> documents. Now set <color:#22D3EE>storage.mode: %to%</color> and restart.</gray>"
  migrate-failed: "%brand_prefix%✖ Migration stopped: <white>%reason%</white></gray>"
