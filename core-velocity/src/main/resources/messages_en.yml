prefix: "%brand_prefix%"
general:
  players-only: "%brand_prefix%✖ This command can only be used by players.</gray>"
  no-permission: "%brand_prefix%✖ You do not have permission to do that.</gray>"
hub:
  already-there: "%brand_prefix%You are already connected to the lobby.</gray>"
  connected: "%brand_prefix%✔ You have been connected to the lobby.</gray>"
  unreachable: "%brand_prefix%✖ The lobby is currently unreachable. Please try again in a moment.</gray>"
sendall:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/sendall server</color></gray>"
  unknown-server: "%brand_prefix%✖ The server <color:#22D3EE>%server%</color> is not registered.</gray>"
  success: "%brand_prefix%✔ Sending <color:#22D3EE>%count%</color> players to <color:#22D3EE>%server%</color>.</gray>"
maintenance:
  usage: "%brand_prefix%Usage: <color:#22D3EE>/maintenance on|off|status</color></gray>"
  enabled: "%brand_prefix%✔ Maintenance mode enabled. New connections without bypass will be rejected.</gray>"
  disabled: "%brand_prefix%✔ Maintenance mode disabled. The network is open to everyone again.</gray>"
  already-on: "%brand_prefix%Maintenance mode is already active.</gray>"
  already-off: "%brand_prefix%Maintenance mode is already disabled.</gray>"
  status-on: "%brand_prefix%Maintenance mode: <color:#FBBF24>● active</color></gray>"
  status-off: "%brand_prefix%Maintenance mode: <color:#2DD4BF>● inactive</color></gray>"
  kick: "%brand%<newline><newline><color:#FBBF24>◆ Maintenance</color><newline><newline><gray>We are working on the network right now.</gray><newline><gray>Please check back shortly.</gray>"
kick:
  redirected: "%brand_prefix%Your connection was closed. You are now in the lobby.</gray>"
  redirected-reason: "%brand_prefix%Your connection was closed. You are now in the lobby.</gray><newline><dark_gray>Reason:</dark_gray> <gray>%reason%</gray>"
