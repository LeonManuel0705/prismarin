name: prismarin-infra

networks:
  prismarin:
    name: prismarin

volumes:
  mongodb-data:
  redis-data:
  mariadb-data:
  prometheus-data:
  grafana-data:

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    networks:
      - prismarin
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - prismarin
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    restart: unless-stopped
    networks:
      - prismarin
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-prismarin-root}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-prismarin}
      MARIADB_USER: ${MARIADB_USER:-prismarin}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-prismarin}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    networks:
      - prismarin
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - redis-exporter
      - mongodb-exporter

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    networks:
      - prismarin
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-prismarin}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    networks:
      - prismarin
    ports:
      - "127.0.0.1:9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    restart: unless-stopped
    networks:
      - prismarin
    ports:
      - "127.0.0.1:9216:9216"
    command:
      - "--mongodb.uri=mongodb://mongodb:27017"
      - "--collector.diagnosticdata"
      - "--collector.dbstats"
      - "--compatible-mode"
    depends_on:
      mongodb:
        condition: service_healthy
