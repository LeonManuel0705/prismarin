[versions]
paper = "1.21.11-R0.1-SNAPSHOT"
velocity = "3.4.0-SNAPSHOT"
luckperms = "5.4"
configurate = "4.2.0"
lettuce = "6.5.5.RELEASE"
mongodb = "5.2.1"
guice = "7.0.0"
gson = "2.11.0"
adventure = "4.24.0"
junit = "5.11.4"
junit-platform = "1.11.4"
mockito = "5.15.2"
testcontainers = "2.0.5"
testcontainers-redis = "3.0.1"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
luckperms-api = { module = "net.luckperms:api", version.ref = "luckperms" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
lettuce-core = { module = "io.lettuce:lettuce-core", version.ref = "lettuce" }
mongodb-driver-sync = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }
guice = { module = "com.google.inject:guice", version.ref = "guice" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
adventure-api = { module = "net.kyori:adventure-api", version.ref = "adventure" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-mongodb = { module = "org.testcontainers:testcontainers-mongodb", version.ref = "testcontainers" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version.ref = "testcontainers-redis" }
